    <text x="132" y="84" font-family="Verdana, sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" letter-spacing="4">DESTRA</text>
    <g fill="#94a3b8" font-family="Verdana, sans-serif" font-size="11" letter-spacing="2">
