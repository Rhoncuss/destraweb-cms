    <text x="56" y="196" font-family="Verdana, sans-serif" font-size="11" fill="#22d3ee" letter-spacing="6">FUTURE / NOW</text>
    <text x="56" y="266" font-family="Verdana, sans-serif" font-weight="bold" font-size="62" fill="#f8fafc" letter-spacing="-1">BUILD FASTER.</text>
    <text x="56" y="336" font-family="Verdana, sans-serif" font-weight="bold" font-size="62" fill="url(#v-neon)" letter-spacing="-1">SHIP BOLDER.</text>
    <rect x="56" y="368" width="430" height="10" rx="5" fill="#253046"/>
    <rect x="56" y="390" width="360" height="10" rx="5" fill="#1b2436"/>
    <rect x="56" y="432" width="176" height="46" rx="23" fill="url(#v-neon)"/>
