<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Velocity theme preview">
    <defs>
        <linearGradient id="v-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#070b14"/>
            <stop offset=".55" stop-color="#0b1322"/>
            <stop offset="1" stop-color="#101827"/>
        </linearGradient>
        <linearGradient id="v-neon" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#a855f7"/>
        </linearGradient>
        <linearGradient id="v-pink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a855f7"/>
            <stop offset="1" stop-color="#f472b6"/>
        </linearGradient>
        <filter id="v-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="18" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="1200" height="800" fill="url(#v-bg)"/>
    <circle cx="1040" cy="60" r="220" fill="#a855f7" opacity=".16"/>
    <circle cx="80" cy="240" r="180" fill="#22d3ee" opacity=".12"/>

    <rect x="56" y="44" width="1088" height="66" rx="33" fill="#101827" opacity=".85" stroke="#253046"/>
