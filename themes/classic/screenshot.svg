    <text x="60" y="188" font-family="Georgia, serif" font-size="13" fill="#7a2e2e" letter-spacing="3">EDITOR'S NOTE</text>
    <text x="60" y="240" font-family="Georgia, serif" font-size="54" fill="#17181c">A slower kind of</text>
    <text x="60" y="300" font-family="Georgia, serif" font-size="54" fill="#17181c">publishing</text>
    <rect x="60" y="330" width="560" height="1" fill="#ddd6ca"/>
    <text x="60" y="364" font-family="Georgia, serif" font-size="17" fill="#33343a">Long reads, careful editing and room to think.</text>
    <text x="60" y="390" font-family="Georgia, serif" font-size="17" fill="#33343a">Everything the modern newsroom needs.</text>
    <rect x="60" y="420" width="158" height="40" fill="#17181c"/>
